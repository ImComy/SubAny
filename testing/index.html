<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SubAny Test Cases</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #111a2e;
    --panel-2: #16223d;
    --border: #1f2b48;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --pass: #22c55e;
    --fail: #ef4444;
    --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, sans-serif; }
  #app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }

  /* ---------- Sidebar ---------- */
  #sidebar { background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px 8px 40px; }
  #sidebar h1 { font-size: 15px; margin: 8px 8px 4px; letter-spacing: .5px; }
  #sidebar .sub { font-size: 11px; color: var(--muted); margin: 0 8px 12px; }
  #sidebar .progress { margin: 0 8px 14px; font-size: 12px; color: var(--muted); }
  #sidebar .progress b { color: var(--accent); }
  .cat { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 14px 8px 6px; }
  .case-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 12.5px; color: var(--text); }
  .case-item:hover { background: var(--panel-2); }
  .case-item.active { background: rgba(56,189,248,0.12); box-shadow: inset 0 0 0 1px rgba(56,189,248,0.35); }
  .case-item .id { font-size: 10px; color: var(--muted); width: 26px; font-variant-numeric: tabular-nums; }
  .case-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .case-item .status { width: 16px; height: 16px; border-radius: 50%; background: transparent; border: 1px solid var(--border); flex: 0 0 16px; }
  .case-item .status.pass { background: var(--pass); border-color: var(--pass); }
  .case-item .status.fail { background: var(--fail); border-color: var(--fail); }

  /* ---------- Main ---------- */
  #main { display: flex; flex-direction: column; overflow: hidden; }
  #header { padding: 16px 22px; border-bottom: 1px solid var(--border); background: var(--panel); }
  #header .kicker { font-size: 11px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; }
  #header h2 { margin: 4px 0 8px; font-size: 18px; }
  #header .desc { font-size: 13px; color: var(--text); margin: 0 0 8px; line-height: 1.45; }
  #header .expected { font-size: 12.5px; color: var(--accent); padding: 8px 12px; background: rgba(56,189,248,0.08); border-left: 3px solid var(--accent); border-radius: 4px; margin: 0; line-height: 1.45; }

  #stage { flex: 1; overflow: auto; padding: 22px; display: flex; justify-content: center; align-items: flex-start; }
  #mount { background: #000; }

  #footer { border-top: 1px solid var(--border); background: var(--panel); padding: 10px 22px; display: flex; align-items: flex-start; gap: 12px; }
  #footer textarea { flex: 1; min-height: 44px; resize: vertical; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 8px 10px; font: inherit; font-size: 12.5px; }
  #footer .actions { display: flex; flex-direction: column; gap: 6px; }
  #footer button { cursor: pointer; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); padding: 7px 14px; border-radius: 6px; font: inherit; font-size: 12.5px; font-weight: 600; min-width: 130px; }
  #footer button:hover { border-color: var(--accent); }
  #footer button.pass { border-color: rgba(34,197,94,0.5); color: #86efac; }
  #footer button.pass.active { background: var(--pass); color: #052e16; border-color: var(--pass); }
  #footer button.fail { border-color: rgba(239,68,68,0.5); color: #fca5a5; }
  #footer button.fail.active { background: var(--fail); color: #450a0a; border-color: var(--fail); }
  #footer button.neutral { color: var(--muted); }

  /* ---------- Shared player CSS used by test cases ---------- */
  .player-shell { position: relative; background: #000; overflow: hidden; }
  .test-video { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }
  .caption-layer { position: absolute; inset: 0; pointer-events: none; }
  .caption-wrapper { position: absolute; left: 0; right: 0; bottom: 56px; text-align: center; padding: 0 32px; pointer-events: none; }
  .caption-text { display: inline; color: #fff; font-family: Inter, system-ui, sans-serif; font-size: 22px; font-weight: 600; line-height: 1.35; text-shadow: 0 2px 6px rgba(0,0,0,0.95); pointer-events: auto; cursor: pointer; }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <h1>SubAny Test Cases</h1>
    <p class="sub">Click a case, then interact with the player. Mark pass/fail as you go.</p>
    <div class="progress" id="progress"></div>
    <div id="case-list"></div>
  </aside>
  <main id="main">
    <header id="header">
      <div class="kicker" id="kicker">—</div>
      <h2 id="case-title">Select a case</h2>
      <p class="desc" id="case-desc"></p>
      <p class="expected" id="case-expected"></p>
    </header>
    <div id="stage"><div id="mount"></div></div>
    <footer id="footer">
      <textarea id="notes" placeholder="Notes (optional) — what did you observe?"></textarea>
      <div class="actions">
        <button class="pass" id="btn-pass">✅ Pass</button>
        <button class="fail" id="btn-fail">❌ Fail</button>
        <button class="neutral" id="btn-reload">↻ Reload case</button>
        <button class="neutral" id="btn-clear">Clear all results</button>
      </div>
    </footer>
  </main>
</div>

<script>
"use strict";

// ============================================================================
// Constants & shared cue lists
// ============================================================================

const VIDEO_SRC = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';

const CUES = {
  standard: [
    'Hello world',
    '(grunting)',
    'My wife-- same thing.',
    'This is a much longer subtitle line that should wrap to multiple lines on smaller viewports',
    'OK',
    'Yes!',
  ],
  shortOnly:  ['(grunting)', 'Hello world', '(grunting)', 'OK', '(grunting)'],
  okOnly:     ['OK', 'Hello world', 'OK', 'Yes!', 'OK'],
  longOnly:   ['This is a much longer subtitle line that should wrap to multiple lines on smaller viewports', 'Short cue', 'This is a much longer subtitle line that should wrap to multiple lines on smaller viewports'],
  speaker:    ['JOHN: Get out of here.', 'MARY: No.', 'JOHN: Get out of here.'],
  emoji:      ["She's gone 😢", 'Hello world', "She's gone 😢"],
  rtl:        ['مرحبا بالعالم', 'Hello world', 'مرحبا بالعالم'],
  lines2:     ['First line<br>Second line', 'Single line', 'First line<br>Second line'],
  multispans: [
    '<span>My</span> <span>wife--</span> <span>same</span> <span>thing.</span>',
    '<span>Hello</span> <span>world</span>',
    '<span>My</span> <span>wife--</span> <span>same</span> <span>thing.</span>',
  ],
};

// ============================================================================
// Harness plumbing
// ============================================================================

const STORAGE_KEY = 'subany-test-state-v1';

let state = loadState();
let currentCase = null;
let currentCleanup = null;

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (_) {}
  return { results: {}, notes: {} };
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
}

// ============================================================================
// Player building helpers
// ============================================================================

/**
 * Build a standard player shell inside `mount`.
 *
 * opts:
 *   width, height        — player size (default 800x450)
 *   wrapperHTML          — inner HTML of .caption-layer, must contain .caption-text somewhere
 *   extraCSS             — additional CSS injected into the document <head>
 *   noCaption            — if true, don't add a caption layer at all
 *   videoOnly            — if true, don't add any wrapper around the video
 */
function makePlayer(mount, opts = {}) {
  const width = opts.width || 800;
  const height = opts.height || 450;

  const shell = document.createElement('div');
  shell.className = 'player-shell';
  shell.style.width = width + 'px';
  shell.style.height = height + 'px';

  const video = document.createElement('video');
  video.className = 'test-video';
  video.src = VIDEO_SRC;
  video.controls = true;
  video.muted = true;
  video.loop = true;
  video.playsInline = true;
  video.preload = 'metadata';
  shell.appendChild(video);

  if (!opts.noCaption && !opts.videoOnly) {
    const layer = document.createElement('div');
    layer.className = 'caption-layer';
    layer.innerHTML = opts.wrapperHTML || '<div class="caption-wrapper"><span class="caption-text"></span></div>';
    shell.appendChild(layer);
  }

  mount.appendChild(shell);

  const styleEl = document.createElement('style');
  styleEl.textContent = `
    .player-shell { width:${width}px; height:${height}px; }
    ${opts.extraCSS || ''}
  `;
  document.head.appendChild(styleEl);

  const layer = shell.querySelector('.caption-layer');
  const captionText = shell.querySelector('.caption-text');

  const setCaption = (html) => {
    if (captionText) {
      captionText.innerHTML = html;
    } else if (opts.customSetCaption) {
      opts.customSetCaption(shell, html);
    }
  };

  const cleanup = () => {
    styleEl.remove();
    shell.remove();
  };

  return { shell, video, layer, captionText, setCaption, cleanup };
}

/**
 * Cycle cues through `setCaption`.
 * Returns a stop() function.
 */
function playCues(setCaption, cues, opts = {}) {
  let i = 0;
  let timeoutId = null;
  let stopped = false;
  const gap = opts.gap ?? 200;
  const duration = opts.duration ?? 3000;

  const step = () => {
    if (stopped) return;
    setCaption(cues[i % cues.length]);
    timeoutId = setTimeout(() => {
      if (stopped) return;
      if (opts.emptyBetween !== false) setCaption('');
      i++;
      timeoutId = setTimeout(step, gap);
    }, duration);
  };
  step();

  return () => {
    stopped = true;
    if (timeoutId) clearTimeout(timeoutId);
  };
}

// ============================================================================
// Case definitions
// ============================================================================

/**
 * Every case:
 *   id           — string, e.g. '001'
 *   category     — sidebar grouping
 *   name         — short title
 *   description  — what the case is
 *   expected     — what "pass" means
 *   render(mount) — returns a cleanup function
 */
const CASES = [

  // -------------------------------------------------------------- Set 1
  {
    id: '001', category: 'Caption geometry', name: 'Simple single-span caption',
    description: 'Minimal caption: one full-width wrapper, one inline span holding the text.',
    expected: 'After clicking the caption, the dashed box hugs the glyphs of the text, not the wrapper. For "Hello world" the box should be under ~180px wide.',
    render(mount) {
      const p = makePlayer(mount, {});
      const stop = playCues(p.setCaption, CUES.standard);
      return () => { stop(); p.cleanup(); };
    },
  },
  {
    id: '002', category: 'Caption geometry', name: 'Full-width block wrapper with tight inline span',
    description: 'Wrapper is width:100% and text-align:center; the caption itself is a tight inline span inside a block child.',
    expected: 'The dashed box must hug the inline span, not the 800px block.',
    render(mount) {
      const p = makePlayer(mount, {
        wrapperHTML: '<div class="cw-outer"><div class="cw-inner"><span class="caption-text"></span></div></div>',
        extraCSS: `
          .cw-outer { position:absolute; left:0; right:0; bottom:56px; width:100%; text-align:center; }
          .cw-inner { display:block; width:100%; }
          .cw-inner .caption-text { display:inline; }
        `,
      });
      const stop = playCues(p.setCaption, CUES.standard);
      return () => { stop(); p.cleanup(); };
    },
  },
  {
    id: '003', category: 'Caption geometry', name: 'Multi-line caption (2 lines, one span)',
    description: 'A single span containing two lines separated by <br>.',
    expected: 'The dashed box encloses both rendered lines as one union.',
    render(mount) {
      const p = makePlayer(mount, {});
      const stop = playCues(p.setCaption, CUES.lines2);
      return () => { stop(); p.cleanup(); };
    },
  },
  {
    id: '004', category: 'Caption geometry', name: 'Multi-span caption (words split across spans)',
    description: 'Each word is in its own <span>, adjacent to spaces.',
    expected: 'The dashed box unions every span, covering the full sentence.',
    render(mount) {
      const p = makePlayer(mount, {});
      const stop = playCues(p.setCaption, CUES.multispans);
      return () => { stop(); p.cleanup(); };
    },
  },
  {
    id: '005', category: 'Caption geometry', name: 'Short cue "(grunting)"',
    description: 'Cue list is dominated by the short "(grunting)" cue, which must be visible for most of the run.',
    expected: 'The dashed box appears on "(grunting)" immediately and hugs the parentheses. It must not stretch to wrapper width.',
    render(mount) {
      const p = makePlayer(mount, {});
      const stop = playCues(p.setCaption, CUES.shortOnly, { duration: 4000 });
      return () => { stop(); p.cleanup(); };
    },
  },
  {
    id: '006', category: 'Caption geometry', name: 'Very short cue "OK"',
    description: 'A two-character cue. This is the smallest realistic caption.',
    expected: 'A dashed box still appears; it is small and hugs the two letters.',
    render(mount) {
      const p = makePlayer(mount, {});
      const stop = playCues(p.setCaption, CUES.okOnly, { duration: 4000 });
      return () => { stop(); p.cleanup(); };
    },
  },
  {
    id: '007', category: 'Caption geometry', name: 'Long cue that wraps to multiple lines',
    description: 'A cue that exceeds the wrapper width and wraps to multiple lines.',
    expected: 'The box grows to enclose both rendered lines.',
    render(mount) {
      const p = makePlayer(mount, { width: 600 });
      const stop = playCues(p.setCaption, CUES.longOnly);
      return () => { stop(); p.cleanup(); };
    },
  },
  {
    id: '008', category: 'Caption geometry', name: 'Caption with speaker label',
    description: 'Cue contains "JOHN: Get out of here." — speaker label is part of the caption text.',
    expected: 'The box includes the speaker label (the full caption string).',
    render(mount) {
      const p = makePlayer(mount, {});
      const stop = playCues(p.setCaption, CUES.speaker);
      return () => { stop(); p.cleanup(); };
    },
  },
  {
    id: '009', category: 'Caption geometry', name: 'Caption with emoji / unicode',
    description: 'Cue includes a unicode emoji.',
    expected: 'The box hugs the glyphs including the emoji, not a fallback box.',
    render(mount) {
      const p = makePlayer(mount, {});
      const stop = playCues(p.setCaption, CUES.emoji);
      return () => { stop(); p.cleanup(); };
    },
  },
  {
    id: '010', category: 'Caption geometry', name: 'RTL caption (Arabic)',
    description: 'Caption is Arabic. Browser lays it out right-to-left.',
    expected: 'The box follows the actual rendered glyphs (right-aligned).',
    render(mount) {
      const p = makePlayer(mount, {});
      if (p.captionText) p.captionText.setAttribute('dir', 'rtl');
      const stop = playCues(p.setCaption, CUES.rtl);
      return () => { stop(); p.cleanup(); };
    },
  },

  // -------------------------------------------------------------- Set 2
  {
    id: '011', category: 'Sibling UI in wrapper', name: 'Wrapper contains a "Next Episode" button',
    description: 'The caption wrapper also contains a sibling <button>Next Episode</button> (mimics vidfast.vc).',
    expected: 'The dashed box hugs ONLY the caption text, never the button.',
    render(mount) {
      const p = makePlayer(mount, {
        wrapperHTML: `
          <div class="cw-outer">
            <div class="cw-caption"><span class="caption-text"></span></div>
            <button class="cw-next">Next Episode</button>
          </div>`,
        extraCSS: `
          .cw-outer { position:absolute; left:0; right:0; bottom:56px; width:100%; text-align:center; }
          .cw-caption { display:block; }
          .cw-next { position:absolute; right:24px; bottom:-44px; padding:6px 12px; border-radius:6px; background:#1e293b; color:#e2e8f0; border:1px solid #334155; pointer-events:auto; }
        `,
      });
      const stop = playCues(p.setCaption, CUES.standard);
      return () => { stop(); p.cleanup(); };
    },
  },
  {
    id: '012', category: 'Sibling UI in wrapper', name: 'Wrapper contains timecodes',
    description: 'The caption wrapper also contains a sibling timecode row "38:24 / 1:07:17".',
    expected: 'The dashed box hugs ONLY the caption text, never the timecodes.',
    render(mount) {
      const p = makePlayer(mount, {
        wrapperHTML: `
          <div class="cw-outer">
            <div class="cw-caption"><span class="caption-text"></span></div>
            <div class="cw-times"><span>38:24</span> / <span>1:07:17</span></div>
          </div>`,
        extraCSS: `
          .cw-outer { position:absolute; left:0; right:0; bottom:56px; width:100%; text-align:center; }
          .cw-caption { display:block; }
          .cw-times { margin-top:10px; color:#94a3b8; font: 14px Inter, sans-serif; }
        `,
      });
      const stop = playCues(p.setCaption, CUES.standard);
      return () => { stop(); p.cleanup(); };
    },
  },
  {
    id: '013', category: 'Sibling UI in wrapper', name: 'Wrapper contains BOTH button and timecodes',
    description: 'Combines cases 011 and 012. This is the exact layout from vidfast.vc that failed.',
    expected: 'The dashed box hugs ONLY the caption text — never the button, never the timecodes.',
    render(mount) {
      const p = makePlayer(mount, {
        wrapperHTML: `
          <div class="cw-outer">
            <div class="cw-caption"><span class="caption-text"></span></div>
            <button class="cw-next">Next Episode</button>
            <div class="cw-times"><span>38:24</span> / <span>1:07:17</span></div>
          </div>`,
        extraCSS: `
          .cw-outer { position:absolute; left:0; right:0; bottom:56px; width:100%; text-align:center; }
          .cw-caption { display:block; }
          .cw-next { position:absolute; right:24px; top:-40px; padding:6px 12px; border-radius:6px; background:#1e293b; color:#e2e8f0; border:1px solid #334155; pointer-events:auto; }
          .cw-times { margin-top:10px; color:#94a3b8; font: 14px Inter, sans-serif; }
        `,
      });
      const stop = playCues(p.setCaption, CUES.standard);
      return () => { stop(); p.cleanup(); };
    },
  },
  {
    id: '014', category: 'Sibling UI in wrapper', name: 'Wrapper contains player chrome (play/pause buttons)',
    description: 'Wrapper contains a sibling control bar with ▶ ⏸ buttons, mimicking a bottom chrome strip.',
    expected: 'The dashed box hugs ONLY the caption text, never the player chrome strip.',
    render(mount) {
      const p = makePlayer(mount, {
        wrapperHTML: `
          <div class="cw-outer">
            <div class="cw-caption"><span class="caption-text"></span></div>
            <div class="cw-controls"><button>▶</button><button>⏸</button><button>⏹</button></div>
          </div>`,
        extraCSS: `
          .cw-outer { position:absolute; left:0; right:0; bottom:56px; width:100%; text-align:center; }
          .cw-caption { display:block; }
          .cw-controls { margin-top:14px; display:flex; gap:10px; justify-content:center; }
          .cw-controls button { background:#1e293b; color:#e2e8f0; border:1px solid #334155; border-radius:6px; padding:6px 14px; pointer-events:auto; }
        `,
      });
      const stop = playCues(p.setCaption, CUES.standard);
      return () => { stop(); p.cleanup(); };
    },
  },

  // -------------------------------------------------------------- Set 3
  {
    id: '015', category: 'Caption motion', name: 'Caption moves via transform (idle toggle)',
    description: 'Every 4 seconds the wrapper toggles style.transform = translateY(40px). This is how vidfast.vc slides the caption when the control bar hides.',
    expected: 'The dashed box follows the caption down and back up in real time, within ~1 frame.',
    render(mount) {
      const p = makePlayer(mount, {});
      const stop = playCues(p.setCaption, CUES.standard);
      const wrapper = p.shell.querySelector('.caption-wrapper');
      let up = false;
      const id = setInterval(() => {
        up = !up;
        wrapper.style.transform = up ? 'translateY(40px)' : 'translateY(0)';
      }, 4000);
      return () => { stop(); clearInterval(id); p.cleanup(); };
    },
  },
  {
    id: '016', category: 'Caption motion', name: 'Caption moves via top property',
    description: 'Same as 015, but using style.top instead of transform.',
    expected: 'The dashed box follows the caption.',
    render(mount) {
      const p = makePlayer(mount, {});
      const stop = playCues(p.setCaption, CUES.standard);
      const wrapper = p.shell.querySelector('.caption-wrapper');
      let down = false;
      const id = setInterval(() => {
        down = !down;
        wrapper.style.top = down ? '20px' : '';
        wrapper.style.bottom = down ? 'auto' : '56px';
      }, 4000);
      return () => { stop(); clearInterval(id); p.cleanup(); };
    },
  },
  {
    id: '017', category: 'Caption motion', name: 'Caption animates via CSS transition',
    description: 'Wrapper has transition: transform 250ms ease. The transform toggles every 4 seconds.',
    expected: 'The dashed box follows during the animation, not just at the end.',
    render(mount) {
      const p = makePlayer(mount, {
        extraCSS: `.caption-wrapper { transition: transform 250ms ease; }`,
      });
      const stop = playCues(p.setCaption, CUES.standard);
      const wrapper = p.shell.querySelector('.caption-wrapper');
      let up = false;
      const id = setInterval(() => {
        up = !up;
        wrapper.style.transform = up ? 'translateY(30px)' : 'translateY(0)';
      }, 4000);
      return () => { stop(); clearInterval(id); p.cleanup(); };
    },
  },
  {
    id: '018', category: 'Caption motion', name: 'Caption is continuously CSS-animated',
    description: 'Wrapper has an infinite bob animation via @keyframes.',
    expected: 'The dashed box tracks the animation in real time.',
    render(mount) {
      const p = makePlayer(mount, {
        extraCSS: `
          @keyframes subany-test-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
          .caption-wrapper { animation: subany-test-bob 2s ease-in-out infinite; }
        `,
      });
      const stop = playCues(p.setCaption, CUES.standard);
      return () => { stop(); p.cleanup(); };
    },
  },
  {
    id: '019', category: 'Caption motion', name: 'Window resize',
    description: 'Resize the Brave window while the caption is locked.',
    expected: 'The dashed box repositions on every resize event without flicker.',
    render(mount) {
      const p = makePlayer(mount, {});
      const stop = playCues(p.setCaption, CUES.standard);
      return () => { stop(); p.cleanup(); };
    },
  },
  {
    id: '020', category: 'Caption motion', name: 'Fullscreen toggle',
    description: 'Press F11 or use the video element\'s fullscreen control while locked.',
    expected: 'The dashed box repositions correctly in fullscreen and again on exit.',
    render(mount) {
      const p = makePlayer(mount, {});
      const stop = playCues(p.setCaption, CUES.standard);
      return () => { stop(); p.cleanup(); };
    },
  },

  // -------------------------------------------------------------- Set 4
  {
    id: '021', category: 'Caption lifecycle', name: 'Player mutates textContent in place',
    description: 'The same caption <span> has its textContent replaced on every cue. This is the default behavior in most tests.',
    expected: 'The dashed box updates on every cue.',
    render(mount) {
      const p = makePlayer(mount, {});
      const stop = playCues(p.setCaption, CUES.standard);
      return () => { stop(); p.cleanup(); };
    },
  },
  {
    id: '022', category: 'Caption lifecycle', name: 'Player replaces the entire caption DOM per cue',
    description: 'Instead of mutating text, the caption <span> is destroyed and rebuilt on every cue.',

// ============================================================================
// Sidebar / navigation
// ============================================================================

const caseListEl  = document.getElementById('case-list');
const progressEl  = document.getElementById('progress');
const headerTitle = document.getElementById('case-title');
const headerKick  = document.getElementById('kicker');
const headerDesc  = document.getElementById('case-desc');
const headerExp   = document.getElementById('case-expected');
const mountEl     = document.getElementById('mount');
const notesEl     = document.getElementById('notes');
const btnPass     = document.getElementById('btn-pass');
const btnFail     = document.getElementById('btn-fail');
const btnReload   = document.getElementById('btn-reload');
const btnClear    = document.getElementById('btn-clear');

// Group cases by category, preserving order.
const CATEGORIES = [];
const BY_CAT = new Map();
for (const c of CASES) {
  if (!BY_CAT.has(c.category)) { BY_CAT.set(c.category, []); CATEGORIES.push(c.category); }
  BY_CAT.get(c.category).push(c);
}

function buildSidebar() {
  caseListEl.innerHTML = '';
  for (const cat of CATEGORIES) {
    const h = document.createElement('div');
    h.className = 'cat';
    h.textContent = cat;
    caseListEl.appendChild(h);
    for (const c of BY_CAT.get(cat)) {
      const row = document.createElement('div');
      row.className = 'case-item';
      row.dataset.id = c.id;
      row.innerHTML = `
        <span class="id">${c.id}</span>
        <span class="name"></span>
        <span class="status"></span>`;
      row.querySelector('.name').textContent = c.name;
      row.addEventListener('click', () => selectCase(c.id));
      caseListEl.appendChild(row);
    }
  }
  refreshSidebarStates();
}

function refreshSidebarStates() {
  for (const row of caseListEl.querySelectorAll('.case-item')) {
    const id = row.dataset.id;
    const r = state.results[id];
    const st = row.querySelector('.status');
    st.classList.toggle('pass', r === 'pass');
    st.classList.toggle('fail', r === 'fail');
    row.classList.toggle('active', currentCase && currentCase.id === id);
  }
  const total = CASES.length;
  const pass = CASES.filter(c => state.results[c.id] === 'pass').length;
  const fail = CASES.filter(c => state.results[c.id] === 'fail').length;
  progressEl.innerHTML = `Passed <b>${pass}</b> · Failed <b>${fail}</b> · Total <b>${total}</b>`;
}

function selectCase(id) {
  const c = CASES.find(x => x.id === id);
  if (!c) return;
  currentCase = c;

  headerKick.textContent = `${c.category} · case ${c.id}`;
  headerTitle.textContent = c.name;
  headerDesc.textContent = c.description;
  headerExp.textContent = 'Expected: ' + c.expected;

  notesEl.value = state.notes[id] || '';

  if (currentCleanup) { try { currentCleanup(); } catch (_) {} currentCleanup = null; }
  mountEl.innerHTML = '';

  try {
    currentCleanup = c.render(mountEl) || null;
  } catch (err) {
    const e = document.createElement('pre');
    e.style.cssText = 'color:#fca5a5;padding:20px;font-size:12px;';
    e.textContent = 'Case error:\n' + (err && err.stack || err);
    mountEl.appendChild(e);
  }

  refreshSidebarStates();
}

// ============================================================================
// Footer actions
// ============================================================================

btnPass.addEventListener('click', () => {
  if (!currentCase) return;
  state.results[currentCase.id] = 'pass';
  saveState();
  refreshSidebarStates();
});
btnFail.addEventListener('click', () => {
  if (!currentCase) return;
  state.results[currentCase.id] = 'fail';
  saveState();
  refreshSidebarStates();
});
btnReload.addEventListener('click', () => {
  if (currentCase) selectCase(currentCase.id);
});
btnClear.addEventListener('click', () => {
  if (!confirm('Clear all pass/fail results and notes?')) return;
  state = { results: {}, notes: {} };
  saveState();
  refreshSidebarStates();
  notesEl.value = '';
});
notesEl.addEventListener('input', () => {
  if (!currentCase) return;
  state.notes[currentCase.id] = notesEl.value;
  saveState();
});

// ============================================================================
// Boot
// ============================================================================

buildSidebar();
selectCase(CASES[0].id);
</script>
